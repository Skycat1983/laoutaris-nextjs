name: Main CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-gate:
    name: Run local verification gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm

      - name: Verify runtime
        shell: bash
        run: |
          node_version="$(node --version)"
          npm_version="$(npm --version)"

          if [ "${node_version}" != "v22.14.0" ]; then
            echo "::error::Expected Node v22.14.0, got ${node_version}."
            exit 1
          fi

          if [ "${npm_version}" != "10.9.2" ]; then
            echo "::error::Expected npm 10.9.2, got ${npm_version}."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Check whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          empty_tree="$(git hash-object -t tree /dev/null)"
          zero_sha="0000000000000000000000000000000000000000"

          if [ "${EVENT_NAME}" = "pull_request" ]; then
            echo "Checking whitespace changes from pull request base ${PR_BASE_SHA} to ${GITHUB_SHA}."
            git diff --check "${PR_BASE_SHA}" "${GITHUB_SHA}"
          elif [ "${EVENT_NAME}" = "push" ]; then
            if [ -z "${PUSH_BEFORE_SHA}" ] || [ "${PUSH_BEFORE_SHA}" = "${zero_sha}" ]; then
              echo "Checking whitespace changes from the empty tree to ${GITHUB_SHA}."
              git diff --check "${empty_tree}" "${GITHUB_SHA}"
            else
              echo "Checking whitespace changes from push base ${PUSH_BEFORE_SHA} to ${GITHUB_SHA}."
              git diff --check "${PUSH_BEFORE_SHA}" "${GITHUB_SHA}"
            fi
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            echo "Checking whitespace changes from HEAD^ to ${GITHUB_SHA}."
            git diff --check HEAD^ "${GITHUB_SHA}"
          else
            echo "Checking whitespace changes from the empty tree to ${GITHUB_SHA}."
            git diff --check "${empty_tree}" "${GITHUB_SHA}"
          fi
